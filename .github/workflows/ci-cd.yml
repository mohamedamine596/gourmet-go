name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ─── Order Service ───────────────────────────────────
      - name: Build order-service JAR
        run: mvn clean package -DskipTests
        working-directory: order-service

      - name: Build & Push order-service image
        uses: docker/build-push-action@v5
        with:
          context: ./order-service
          push: true
          tags: aminebougui/order-service:latest

      # ─── Kitchen Service ─────────────────────────────────
      - name: Build kitchen-service JAR
        run: mvn clean package -DskipTests
        working-directory: kitchen-service

      - name: Build & Push kitchen-service image
        uses: docker/build-push-action@v5
        with:
          context: ./kitchen-service
          push: true
          tags: aminebougui/kitchen-service:latest

      # ─── Accounting Service ──────────────────────────────
      - name: Build accounting-service JAR
        run: mvn clean package -DskipTests
        working-directory: accounting-service

      - name: Build & Push accounting-service image
        uses: docker/build-push-action@v5
        with:
          context: ./accounting-service
          push: true
          tags: aminebougui/accounting-service:latest

      # ─── Order Orchestrator ──────────────────────────────
      - name: Build order-orchestrator JAR
        run: mvn clean package -DskipTests
        working-directory: order-orchestrator

      - name: Build & Push order-orchestrator image
        uses: docker/build-push-action@v5
        with:
          context: ./order-orchestrator
          push: true
          tags: aminebougui/order-orchestrator:latest

      # ─── Frontend ────────────────────────────────────────
      - name: Build & Push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: aminebougui/frontend:latest