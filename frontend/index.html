<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gourmet-Go Orders</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
        }

        h1 {
            text-align: center;
            color: #e74c3c;
            margin-bottom: 8px;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 30px;
            font-size: 14px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            margin-bottom: 20px;
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: #e74c3c;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover { background: #c0392b; }
        button:disabled { background: #ccc; cursor: not-allowed; }

        .result {
            margin-top: 24px;
            padding: 16px;
            border-radius: 8px;
            text-align: center;
            font-weight: 600;
            font-size: 16px;
            display: none;
        }

        .result.approved {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .result.rejected {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .result.error {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeeba;
        }

        .spinner {
            display: none;
            text-align: center;
            margin-top: 16px;
            color: #888;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🍽️ Gourmet-Go</h1>
    <p class="subtitle">Distributed Order System</p>

    <label for="orderId">Order ID</label>
    <input type="text" id="orderId" placeholder="e.g. order-123" />

    <label for="amount">Amount (€)</label>
    <input type="number" id="amount" placeholder="e.g. 50" min="1" />

    <button id="submitBtn" onclick="submitOrder()">Place Order</button>

    <div class="spinner" id="spinner">⏳ Processing order...</div>

    <div class="result" id="result"></div>
</div>

<script>
    const API_URL = "http://localhost:8080/order";

    async function submitOrder() {
        const orderId = document.getElementById("orderId").value.trim();
        const amount  = parseFloat(document.getElementById("amount").value);

        if (!orderId || isNaN(amount)) {
            alert("Please fill in both Order ID and Amount.");
            return;
        }

        const btn     = document.getElementById("submitBtn");
        const spinner = document.getElementById("spinner");
        const result  = document.getElementById("result");

        btn.disabled       = true;
        spinner.style.display = "block";
        result.style.display  = "none";

        try {
            const response = await fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ orderId, amount })
            });

            const data = await response.json();

            result.style.display = "block";

            if (data.status === "APPROVED") {
                result.className = "result approved";
                result.innerHTML = "✅ Order <strong>" + data.orderId + "</strong> APPROVED!";
            } else if (data.status === "REJECTED") {
                result.className = "result rejected";
                result.innerHTML = "❌ Order <strong>" + data.orderId + "</strong> REJECTED<br><small>" + data.reason + "</small>";
            } else {
                result.className = "result error";
                result.innerHTML = "⚠️ Error: " + data.reason;
            }

        } catch (err) {
            result.style.display = "block";
            result.className = "result error";
            result.innerHTML = "⚠️ Could not connect to server.";
        } finally {
            btn.disabled          = false;
            spinner.style.display = "none";
        }
    }
</script>
</body>
</html>
